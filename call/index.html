<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Call</title>
<style>
:root{--bg:#F6F3EC;--ink:#1B2230;--soft:#5A6170;--go:#1F8A4C}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100svh;display:grid;place-items:center;padding:22px}
.card{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:28px 24px;box-shadow:0 20px 50px -24px rgba(0,0,0,.35);text-align:center}
.biz{font-size:24px;font-weight:800;line-height:1.2}
.own{color:var(--soft);margin-top:6px}
.num{font-size:30px;font-weight:800;letter-spacing:.01em;margin:22px 0 16px;font-variant-numeric:tabular-nums}
a.call{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--go);color:#fff;text-decoration:none;font-size:21px;font-weight:800;min-height:64px;border-radius:14px}
a.call svg{width:24px;height:24px}
a.sms{display:block;margin-top:12px;color:var(--ink);font-weight:600;text-decoration:none;border:2px solid #E3DDD0;border-radius:14px;padding:14px}
.why{margin-top:20px;text-align:left;background:#F6F3EC;border-radius:12px;padding:14px 16px;font-size:15px;color:#333}
.why b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
</style>
</head>
<body>
<div class="card">
  <div class="biz" id="b">Call</div>
  <div class="own" id="o"></div>
  <div class="num" id="n"></div>
  <a class="call" id="c" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>Call now</a>
  <a class="sms" id="s" href="#">Send a text instead</a>
  <div class="why" id="w" hidden><b>Why you're calling</b><span id="wt"></span></div>
</div>
<script>
const p=new URLSearchParams(location.search),d=(p.get('n')||'').replace(/\D/g,'').slice(-10);
const t=(id,v)=>{document.getElementById(id).textContent=v};
if(d.length===10){
  const f=`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  t('n',f);document.title='Call '+(p.get('b')||f);
  document.getElementById('c').href='tel:+1'+d;document.getElementById('s').href='sms:+1'+d;
  if(p.get('b'))t('b',p.get('b'));
  if(p.get('o'))t('o','Ask for '+p.get('o'));
  if(p.get('w')){t('wt',p.get('w'));document.getElementById('w').hidden=false}
  if(p.get('auto')!=='0')setTimeout(()=>{location.href='tel:+1'+d},350);
}else{t('n','No number given')}
</script>
</body>
</html>
